<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSA - Top 4 Ideas: Detailed Propositions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --p50: #EBEEF4;
      --p100: #D1E2FE;
      --p200: #9CBDFA;
      --p300: #669BF8;
      --p400: #3168D7;
      --p500: #032C70;
      --p600: #03255F;
      --p700: #021F4E;
      --p800: #021638;
      --p900: #010D22;
      --s50: #FBF6EC;
      --s100: #FFF4D9;
      --s200: #FFE9B3;
      --s300: #FFDA80;
      --s400: #FFCC4D;
      --s500: #FFB600;
      --s600: #D89B00;
      --s700: #B38000;
      --n50: #F7F7F7;
      --n100: #EEEEEE;
      --n200: #DEDEDE;
      --n300: #C4C4C4;
      --n400: #A3A3A3;
      --n500: #7D7D7D;
      --n600: #5C5C5C;
      --n700: #424242;
      --n800: #2D2D2D;
      --n900: #1A1A1A;
      --a-red: #E0301E;
      --a-rose: #D93954;
      --a-orange: #EB8C00;
      --a-green: #009A46;
      --g-navy-deep: linear-gradient(135deg, var(--p500) 0%, var(--p800) 100%);
      --g-gold-signature: linear-gradient(135deg, var(--s300) 0%, var(--s500) 70%, var(--s600) 100%);
      --g-card: linear-gradient(160deg, #062357 0%, #021638 100%);
      --ink: var(--n900);
      --ink-mid: var(--n700);
      --ink-soft: var(--n600);
      --bg: var(--s50);
      --bg-alt: var(--n50);
      --border: var(--n200);
      --border-strong: var(--n300);
      --font-head: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      --font-body: 'Open Sans', -apple-system, sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--ink);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      font-size: 14px;
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6,
    .section-title,
    .problem-stat-num,
    .idea-head-text h2 {
      font-family: var(--font-head);
      font-weight: 700;
    }

    /* HEADER */
    .header {
      background: var(--g-navy-deep);
      color: white;
      padding: 18px 28px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 24px rgba(2, 22, 56, 0.25);
    }

    .header-top {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-logo {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: var(--g-gold-signature);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: var(--p800);
      font-size: 20px;
      letter-spacing: -1px;
      flex-shrink: 0;
    }

    .header-top h1 {
      font-size: 17px;
      letter-spacing: -0.2px;
    }

    .header-top p {
      font-size: 11px;
      opacity: 0.75;
      margin-top: 2px;
      letter-spacing: 0.3px;
    }

    /* TABS */
    .tabs {
      display: flex;
      gap: 8px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .tab-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.06);
      color: rgba(255, 255, 255, 0.78);
      font-family: var(--font-body);
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }

    .tab-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      color: white;
    }

    .tab-btn.active {
      background: var(--g-gold-signature);
      color: var(--p800);
      border-color: transparent;
    }

    .tab-icon {
      font-size: 15px;
    }

    /* LAYOUT */
    .wrap {
      max-width: 880px;
      margin: 0 auto;
      padding: 24px 20px 60px;
    }

    .panel {
      display: none;
    }

    .panel.active {
      display: block;
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* IDEA HEAD */
    .idea-head {
      background: var(--g-navy-deep);
      color: white;
      padding: 26px 28px;
      border-radius: 16px;
      display: flex;
      align-items: flex-start;
      gap: 18px;
      position: relative;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .idea-head::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at top right, rgba(255, 182, 0, 0.18), transparent 60%);
      pointer-events: none;
    }

    .idea-head-img {
      width: 64px;
      height: 64px;
      border-radius: 14px;
      overflow: hidden;
      flex-shrink: 0;
      border: 2px solid rgba(255, 255, 255, 0.18);
      position: relative;
      z-index: 1;
      background: white;
    }

    .idea-head-img img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 8px;
    }

    .idea-head-text {
      flex: 1;
      position: relative;
      z-index: 1;
    }

    .idea-head-text .eyebrow {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      color: var(--s400);
      margin-bottom: 6px;
    }

    .idea-head-text h2 {
      font-size: 24px;
      line-height: 1.2;
      letter-spacing: -0.4px;
    }

    .idea-head-text .analogue-line {
      font-size: 12px;
      opacity: 0.8;
      margin-top: 5px;
      font-weight: 500;
    }

    .idea-head-text .tagline {
      font-size: 13px;
      opacity: 0.9;
      margin-top: 10px;
      line-height: 1.5;
      max-width: 520px;
    }

    .revenue-badge {
      position: relative;
      z-index: 1;
      background: var(--g-gold-signature);
      color: var(--p800);
      font-weight: 800;
      font-size: 13px;
      padding: 8px 14px;
      border-radius: 10px;
      white-space: nowrap;
      text-align: center;
      flex-shrink: 0;
    }

    .revenue-badge small {
      display: block;
      font-size: 8.5px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      opacity: 0.7;
      margin-top: 2px;
    }

    /* SECTIONS (ported from drawer template) */
    .section {
      background: white;
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
      position: relative;
    }

    .section-eyebrow {
      font-size: 9.5px;
      text-transform: uppercase;
      letter-spacing: 1.4px;
      color: var(--s600);
      font-weight: 800;
    }

    .section-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--ink);
      margin-top: 4px;
      margin-bottom: 14px;
      letter-spacing: -0.3px;
    }

    .section p {
      font-size: 13px;
      color: var(--ink-mid);
      line-height: 1.6;
      margin-bottom: 10px;
    }

    .section p:last-child {
      margin-bottom: 0;
    }

    .section p b,
    .section li b {
      color: var(--ink);
      font-weight: 700;
    }

    .problem-stat {
      background: var(--p50);
      border-left: 4px solid var(--p500);
      padding: 14px 16px;
      border-radius: 8px;
      margin-bottom: 12px;
    }

    .problem-stat-num {
      font-size: 28px;
      font-weight: 800;
      color: var(--p500);
      line-height: 1;
      letter-spacing: -1px;
    }

    .problem-stat-label {
      font-size: 11.5px;
      color: var(--ink-soft);
      margin-top: 4px;
      font-weight: 500;
      line-height: 1.5;
    }

    .kpi-strip {
      background: var(--s100);
      border: 1px solid var(--s300);
      padding: 12px 16px;
      border-radius: 10px;
      margin-top: 12px;
      font-size: 12.5px;
      color: var(--n800);
      line-height: 1.5;
    }

    .kpi-strip b {
      color: var(--s700);
    }

    .hypo {
      background: var(--g-navy-deep);
      color: white;
      padding: 16px 18px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.55;
      margin-bottom: 12px;
    }

    .hypo span {
      color: var(--s500);
      font-weight: 800;
      display: inline-block;
      margin-right: 6px;
      letter-spacing: 1px;
      font-size: 10px;
    }

    .notion-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--p500);
      text-decoration: none;
      font-size: 12px;
      font-weight: 700;
      margin-top: 4px;
      padding: 8px 12px;
      background: var(--p50);
      border-radius: 8px;
    }

    .notion-link:hover {
      background: var(--p100);
    }

    .feat-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin-top: 4px;
    }

    .feat-item {
      background: var(--bg-alt);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 12px;
      color: var(--ink-mid);
      line-height: 1.5;
    }

    .feat-item b {
      color: var(--ink);
      font-weight: 700;
    }

    /* PROBLEM-FRAMING TABLE */
    .problem-row {
      display: grid;
      grid-template-columns: 28px 1fr;
      gap: 12px;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg-alt);
      margin-bottom: 10px;
    }

    .problem-row:last-child {
      margin-bottom: 0;
    }

    .problem-row-num {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--g-gold-signature);
      color: var(--p800);
      font-weight: 800;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .problem-row-cell {
      margin-bottom: 8px;
    }

    .problem-row-cell:last-child {
      margin-bottom: 0;
    }

    .problem-row-cell label {
      display: block;
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 800;
      color: var(--ink-soft);
      margin-bottom: 2px;
    }

    .problem-row-cell p {
      font-size: 12.5px;
      color: var(--ink-mid);
      line-height: 1.55;
      margin: 0;
    }

    .problem-row-cell.quote p {
      color: var(--ink);
      font-weight: 600;
      font-style: italic;
    }

    .problem-row-cell.opp p {
      color: var(--p500);
    }

    /* STEP FLOW (diagram for step-by-step processes) */
    .step-flow {
      position: relative;
      padding-left: 38px;
      margin-top: 14px;
    }

    .step-flow::before {
      content: '';
      position: absolute;
      left: 14px;
      top: 8px;
      bottom: 8px;
      width: 2px;
      background: var(--border-strong);
    }

    .step-item {
      position: relative;
      margin-bottom: 18px;
    }

    .step-item:last-child {
      margin-bottom: 0;
    }

    .step-num {
      position: absolute;
      left: -38px;
      top: 0;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--g-gold-signature);
      color: var(--p800);
      font-weight: 800;
      font-size: 12.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
    }

    .step-title {
      font-weight: 700;
      font-size: 13px;
      color: var(--ink);
      margin-bottom: 4px;
    }

    .step-body {
      font-size: 12.5px;
      color: var(--ink-mid);
      line-height: 1.6;
    }

    /* GENERIC TABLES */
    .data-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
      font-size: 12px;
    }

    .data-table th {
      text-align: left;
      font-size: 9.5px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--ink-soft);
      font-weight: 800;
      padding: 8px 10px;
      border-bottom: 2px solid var(--border-strong);
    }

    .data-table td {
      padding: 10px;
      border-bottom: 1px solid var(--border);
      color: var(--ink-mid);
      line-height: 1.5;
      vertical-align: top;
    }

    .data-table tr:last-child td {
      border-bottom: none;
    }

    .data-table tr.total td {
      font-weight: 800;
      color: var(--ink);
      background: var(--s100);
    }

    /* GROUP CARDS (who-shows-up motivations etc.) */
    .group-card {
      background: var(--bg-alt);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 10px;
    }

    .group-card:last-child {
      margin-bottom: 0;
    }

    .group-card-head {
      font-size: 11px;
      font-weight: 800;
      color: var(--p500);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 8px;
    }

    .group-card p {
      font-size: 12.5px;
    }

    .group-card ul {
      list-style: none;
      padding: 0;
    }

    .group-card li {
      padding-left: 16px;
      position: relative;
      font-size: 12.5px;
      color: var(--ink-mid);
      margin-bottom: 7px;
      line-height: 1.55;
    }

    .group-card li:last-child {
      margin-bottom: 0;
    }

    .group-card li::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--s500);
      position: absolute;
      left: 0;
      top: 7px;
    }

    /* GLANCE PILLS */
    .glance-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 12px;
    }

    .glance-cell {
      background: var(--bg-alt);
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .glance-cell-label {
      font-size: 9px;
      text-transform: uppercase;
      color: var(--ink-soft);
      font-weight: 800;
      letter-spacing: 0.8px;
    }

    .glance-cell-val {
      font-size: 12.5px;
      color: var(--ink);
      margin-top: 4px;
      font-weight: 700;
      line-height: 1.5;
    }

    .glance-cell.kill {
      background: #FEF2F2;
      border-color: #FCA5A5;
      grid-column: 1 / -1;
    }

    .glance-cell.kill .glance-cell-label {
      color: #B91C1C;
    }

    .glance-cell.kill .glance-cell-val {
      color: #991B1B;
      font-weight: 600;
      font-size: 11.5px;
    }

    /* DASHBOARD LIST */
    .dash-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 8px;
      margin-top: 10px;
    }

    .dash-item {
      background: var(--g-navy-deep);
      color: white;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 12px;
      line-height: 1.5;
    }

    @media (max-width: 640px) {
      .idea-head {
        flex-direction: column;
      }

      .glance-grid {
        grid-template-columns: 1fr;
      }

      .dash-list {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="header">
    <div class="header-top">
      <div class="brand-logo">J</div>
      <div>
        <h1>Top 4 Ideas: Detailed Propositions</h1>
        <p>Naksha-Khulla / JSA · "Now" tier · full Notion content per idea</p>
      </div>
    </div>
    <div class="tabs" id="tabs"></div>
  </div>
  <div class="wrap" id="content"></div>

  <script src="top4-ideas-data.js"></script>
  <script>
    const IDEAS = window.__IDEAS__ || [];
    const LOGO_BASE = 'Images/Logos/';

    function renderProblemTable(rows) {
      return `<div>${rows.map((r, idx) => `
        <div class="problem-row">
          <div class="problem-row-num">${idx + 1}</div>
          <div>
            <div class="problem-row-cell quote"><label>The fabricator's / learner's problem</label><p>${r.quote}</p></div>
            <div class="problem-row-cell"><label>JSA / JSL's problem</label><p>${r.jsa}</p></div>
            <div class="problem-row-cell opp"><label>Opportunity to explore</label><p>${r.opp}</p></div>
          </div>
        </div>`).join('')}</div>`;
    }

    function renderParagraphs(items) {
      return items.map(t => `<p>${t}</p>`).join('');
    }

    function renderList(items) {
      return `<ul style="list-style:none; padding:0; margin-top:8px;">${items.map(t => `<li style="padding-left:16px; position:relative; font-size:12.5px; color:var(--ink-mid); margin-bottom:7px; line-height:1.55;"><span style="content:''; width:6px; height:6px; border-radius:50%; background:var(--s500); position:absolute; left:0; top:7px; display:block;"></span>${t}</li>`).join('')}</ul>`;
    }

    function renderGroups(groups) {
      return groups.map(g => `
        <div class="group-card">
          <div class="group-card-head">${g.heading}</div>
          ${g.intro ? `<p>${g.intro}</p>` : ''}
          <ul>${g.items.map(t => `<li>${t}</li>`).join('')}</ul>
        </div>`).join('');
    }

    function renderSteps(steps) {
      return `<div class="step-flow">${steps.map((s, idx) => `
        <div class="step-item">
          <div class="step-num">${idx + 1}</div>
          ${s.title ? `<div class="step-title">${s.title}</div>` : ''}
          <div class="step-body">${s.body}</div>
        </div>`).join('')}</div>`;
    }

    function renderTable(headers, rows, totalRowIndex) {
      return `<table class="data-table">
        <thead><tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr></thead>
        <tbody>${rows.map((r, idx) => `<tr class="${idx === totalRowIndex ? 'total' : ''}">${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody>
      </table>`;
    }

    function renderGlance(cells) {
      return `<div class="glance-grid">${cells.map(c => `
        <div class="glance-cell ${c.kill ? 'kill' : ''}">
          <div class="glance-cell-label">${c.label}</div>
          <div class="glance-cell-val">${c.val}</div>
        </div>`).join('')}</div>`;
    }

    function renderDashboard(items) {
      return `<div class="dash-list">${items.map(t => `<div class="dash-item">${t}</div>`).join('')}</div>`;
    }

    function renderBody(sec) {
      switch (sec.type) {
        case 'problemTable': return renderProblemTable(sec.data);
        case 'paragraphs': return renderParagraphs(sec.data);
        case 'list': return renderList(sec.data);
        case 'groups': return renderGroups(sec.data);
        case 'steps': return (sec.intro ? `<p>${sec.intro}</p>` : '') + renderSteps(sec.data);
        case 'table': return renderTable(sec.headers, sec.data, sec.totalRowIndex);
        case 'glance': return renderGlance(sec.data);
        case 'dashboard': return renderDashboard(sec.data);
        case 'hypo': return `<div class="hypo"><span>${sec.label || 'NOTE'}</span>${sec.text}</div>`;
        case 'kpi': return `<div class="kpi-strip"><b>${sec.label}</b> ${sec.text}</div>`;
        case 'feat': return `<div class="feat-grid">${sec.data.map(f => `<div class="feat-item">${f}</div>`).join('')}</div>`;
        case 'notion': return `<a class="notion-link" href="${sec.url}" target="_blank">Full proposition in Notion →</a>`;
        case 'mixed': return sec.data.map(sub => `${sub.heading ? `<h4 style="font-size:11px; font-weight:800; color:var(--ink); text-transform:uppercase; letter-spacing:0.6px; margin:14px 0 8px;">${sub.heading}</h4>` : ''}${renderBody(sub)}`).join('');
        default: return '';
      }
    }

    function renderSection(sec) {
      return `<div class="section">
        ${sec.eyebrow ? `<div class="section-eyebrow">${sec.eyebrow}</div>` : ''}
        ${sec.title ? `<div class="section-title">${sec.title}</div>` : ''}
        ${renderBody(sec)}
      </div>`;
    }

    function renderIdea(idea) {
      const logoSrc = idea.logo ? LOGO_BASE + encodeURIComponent(idea.logo) : '';
      return `
        <div class="idea-head">
          <div class="idea-head-img">${idea.logo ? `<img src="${logoSrc}" alt="">` : ''}</div>
          <div class="idea-head-text">
            <div class="eyebrow">${idea.eyebrow}</div>
            <h2>${idea.title}</h2>
            ${idea.analogue ? `<div class="analogue-line">Like ${idea.analogue}</div>` : ''}
            <div class="tagline">${idea.tagline}</div>
          </div>
          <div class="revenue-badge">${idea.revenue}<small>6-mo pilot revenue</small></div>
        </div>
        ${idea.sections.map(renderSection).join('')}
      `;
    }

    function init() {
      const tabsEl = document.getElementById('tabs');
      const contentEl = document.getElementById('content');
      tabsEl.innerHTML = IDEAS.map((idea, idx) => `
        <button class="tab-btn ${idx === 0 ? 'active' : ''}" data-idx="${idx}" onclick="selectTab(${idx})">
          <span class="tab-icon">${idea.icon}</span> ${idea.title}
        </button>`).join('');
      contentEl.innerHTML = IDEAS.map((idea, idx) => `
        <div class="panel ${idx === 0 ? 'active' : ''}" id="panel-${idx}">${renderIdea(idea)}</div>`).join('');
    }

    function selectTab(idx) {
      document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
      document.querySelectorAll('.panel').forEach((p, i) => p.classList.toggle('active', i === idx));
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    init();
  </script>
</body>

</html>
